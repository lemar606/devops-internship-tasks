---
- name: Configure Nginx and WordPress
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    wp_dir: /var/www/wordpress
    wp_user: nginx
    wp_group: nginx

  tasks:
    # Install core components
    - name: Install required packages
      yum:
        name:
          - nginx
          - php
          - php-fpm
          - php-mysqlnd
          - php-json
          - php-gd
          - php-mbstring
          - mariadb  # Client only
        state: present
        update_cache: yes

    # Configure PHP-FPM
    - name: Configure PHP-FPM
      template:
        src: www.conf.j2
        dest: /etc/php-fpm.d/www.conf
      notify: restart php-fpm

    # Configure Nginx
    - name: Deploy Nginx config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/wordpress.conf
      notify: reload nginx

    # Create WordPress directory
    - name: Create WordPress root directory
      file:
        path: "{{ wp_dir }}"
        state: directory
        owner: "{{ wp_user }}"
        group: "{{ wp_group }}"
        mode: '0755'

    # Download WordPress
    - name: Download WordPress
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    # Extract WordPress
    - name: Extract WordPress
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: "{{ wp_dir }}"
        remote_src: yes
        extra_opts: "--strip-components=1"
        owner: "{{ wp_user }}"
        group: "{{ wp_group }}"

    # Configure wp-config.php
    - name: Configure WordPress
      template:
        src: wp-config.php.j2
        dest: "{{ wp_dir }}/wp-config.php"
        owner: "{{ wp_user }}"
        group: "{{ wp_group }}"
        mode: '0644'

    # Set SELinux context
    - name: Set SELinux context for WordPress
      sefcontext:
        target: "{{ wp_dir }}(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: ansible_selinux.status == "enabled"

    - name: Apply SELinux changes
      command: restorecon -Rv "{{ wp_dir }}"
      when: ansible_selinux.status == "enabled"

    # Ensure services are running
    - name: Start and enable services
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - php-fpm

  handlers:
    - name: restart php-fpm
      service:
        name: php-fpm
        state: restarted

    - name: reload nginx
      service:
        name: nginx
        state: reloaded