- name: Configure nginx web server
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Install nginx
      yum:
        name: nginx
        state: present
        update_cache: yes

    - name: Deploy custom nginx.conf (listening on 8080)
      template:
        src: /Users/explorer/Desktop/DevOps/Task2/devops-internship-tasks/Task2/env/prod/ansible/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: reload nginx

    - name: Enable and start nginx
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded
